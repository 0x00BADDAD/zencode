

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false


spring.datasource.url=jdbc:postgresql://localhost:5432/testdb1
spring.datasource.username=user2
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Logging (optional if using log4j2.xml)
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zencode=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
server.address=127.0.0.1

# kafka broker configs
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.zencode.app.kafka.serdes.TrackMetadataBeanSer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.zencode.app.kafka.serdes.TrackMetadataBeanDer
spring.kafka.streams.application-id=myId
