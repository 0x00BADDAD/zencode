<!DOCTYPE HTML>
<html>
  <head>
   <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />

   <style>
      #root {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1358px;
        height: 642px;
        background: linear-gradient(to bottom, #1db954, rgba(205, 227, 213, 0.78));
      }

      .err-msg-holder {
        position: absolute;
        top: 20%;
        left: 25%;
        width:55%;
        height: 15%;
        font-family: monospace;
        font-weight: 600;
        font-size: 2em;
        color: #000;
        text-align: center;
      }


    @media only screen
        and (max-width: 430px)
        and (max-height: 932px){

        /*styles for roughly 440x956 devices*/
        #root{
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 430px;
          height: 932px;
          background: linear-gradient(to bottom, #1db954, rgba(205, 227, 213, 0.78));
        }

      .err-msg-holder {
        position: absolute;
        top: 15%;
        left: 20%;
        width:55%;
        height: 15%;
        font-family: monospace;
        font-weight: 600;
        font-size: 2em;
        color: #000;
        text-align: center;
      }
    }

    </style>
  </head>

  <body>
    <div id="root">
      <div class="err-msg-holder" th:switch="${status}">
          <p th:case="404">This website is a WIP... May be come back later</p>
          <p th:case="500">Internal server error</p>
          <p th:case="*">Something went wrong! Report this at atharv008@gmail.com</p>
      </div>
    </div>
  </body>
</html>
